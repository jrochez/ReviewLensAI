steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile.backend
      - -t
      - $_IMAGE
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_IMAGE']

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/reviewlensai/reviewlensai/backend:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
