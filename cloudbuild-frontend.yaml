steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile.frontend
      - --build-arg
      - BACKEND_URL=$_BACKEND_URL
      - -t
      - $_IMAGE
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_IMAGE']

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/reviewlensai/reviewlensai/frontend:latest
  _BACKEND_URL: http://localhost:9000

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
